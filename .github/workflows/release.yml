name: Release

# Каждый коммит в основную ветку выпускает релиз: поднимает патч-версию, дописывает
# CHANGELOG из сообщений коммитов, собирает архив и публикует его на GitHub.
# Чтобы коммит не выпускал релиз, добавь в его сообщение [skip release].
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MODULE_ID: action-economy

jobs:
  release:
    runs-on: ubuntu-latest
    # Коммит самого workflow помечен [skip release], иначе релизы пошли бы по кругу.
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - name: Забрать репозиторий с историей
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Поднять версию и собрать заметки
        id: prepare
        run: node .github/scripts/bump-and-changelog.mjs

      - name: Зафиксировать версию и CHANGELOG в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json CHANGELOG.md
          git commit -m "chore: релиз ${{ steps.prepare.outputs.tag }} [skip release]"
          git tag "${{ steps.prepare.outputs.tag }}"
          git push origin HEAD --tags

      - name: Подготовить манифест релиза
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/manifest-for-release.mjs

      # В архив попадает только то, что нужно в мире: без планов, тестов и диагностики.
      - name: Собрать архив
        run: zip -r ./${{ env.MODULE_ID }}.zip
          module.json
          scripts/
          styles/
          lang/
          tools/create-effects.js
          README.md
          README.ru.md
          CHANGELOG.md
          LICENSE

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.prepare.outputs.tag }}" \
            --title "${{ steps.prepare.outputs.tag }}" \
            --notes-file release-notes.md \
            ./module.json ./${{ env.MODULE_ID }}.zip
