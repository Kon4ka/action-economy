name: Release

# Срабатывает, когда на GitHub опубликован релиз. Тег вида v0.1.0.
on:
  release:
    types: [published]

env:
  MODULE_ID: action-economy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Версия берётся из тега: v0.1.0 → 0.1.0.
      - name: Extract version from tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # В манифест релиза подставляются версия и ссылки на файлы именно этого релиза,
      # а горячая перезагрузка выключается: она нужна только при разработке.
      - name: Fill in the manifest
        uses: microsoft/variable-substitution@v1
        with:
          files: module.json
        env:
          version: ${{ steps.version.outputs.number }}
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/${{ env.MODULE_ID }}.zip
          readme: https://github.com/${{ github.repository }}/blob/main/README.md
          changelog: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          bugs: https://github.com/${{ github.repository }}/issues
          flags.hotReload: false

      # В архив попадает только то, что нужно в мире: без планов, тестов и диагностики.
      - name: Create ZIP archive
        run: zip -r ./${{ env.MODULE_ID }}.zip
          module.json
          scripts/
          styles/
          lang/
          tools/create-effects.js
          README.md
          README.ru.md
          CHANGELOG.md
          LICENSE

      - name: Attach files to the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          artifacts: "./module.json, ./${{ env.MODULE_ID }}.zip"
